# Packaging for the fab-ops-analytics baseline (Phase 0).
# The audit's P0 defect was that the documented `pytest -q` failed on a clean
# clone because the code was an uninstallable folder named `src`. The fix is a
# proper src-layout package: `pip install -e ".[app,notebook,dev]"` and every
# documented command works from anywhere.

[build-system]
# PEP 639 (`license = "MIT"` with `license-files`) needs 77 or newer.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fab-ops-analytics"
version = "0.1.0"
description = "A synthetic semiconductor fab whose faults are physics-mediated and whose answer key is a separate file, the answer-blind monitors, root-cause engine and decision-support layer that read it, and the benchmark that measures how often the engine is right."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# The workspace is written against the modern width API
# (`width="stretch"`), which arrived in 1.49; the floor states
# that rather than leaving a deprecation warning for a reader to
# discover at run time.
app = ["streamlit>=1.49"]
notebook = ["jupyter>=1.0", "nbclient>=0.8", "nbformat>=5.9"]
dev = ["pytest>=7.0"]

[project.scripts]
fabops-build = "fabops.build_db:main"
fabops-investigate = "fabops.investigation:main"
# The engine. `fabops-investigate` above is the LEGACY narrated demo, whose
# conclusion is a constant in `fabops.config` (ADR-003 grandfathers it,
# ADR-010 keeps it until its replacement is strictly better on that surface).
# They are separately named so that typing the obvious command cannot hand
# somebody the hard-coded story and let them believe they ran the engine.
fabops-diagnose = "fabops.diagnosis.cli:main"
# The four monitor families over one schema v2 dataset: SPC/EWMA/CUSUM on
# process residuals, equipment health, target-normalized yield, defect movers
# and per-wafer spatial signatures. Reports signals a human reads; it reaches
# no conclusion, which is why it is a separate verb from `diagnose`.
fabops-monitor = "fabops.monitors.cli:main"
# The decision-support artifact: the investigation, plus impact, containment
# ranking and recommended checks for whichever subject the engine named or the
# caller supplied. `fabops.report/v1`, which embeds `fabops.investigation/v1`.
fabops-report = "fabops.report.cli:main"
# The Phase 6 benchmark: builds a named population, scores the engine on it and
# prints the results table with the population attached. Deliberately named for
# the evaluator rather than for the engine — it reads both planes, which
# neither of the two above may do.
fabops-benchmark = "fabeval.benchmark:main"
# Renders the README's benchmark section from a committed results document.
# It measures nothing: `fabops-benchmark --emit` produces the numbers and this
# turns them into prose, so a public figure and a measured one cannot part
# company without a test noticing.
fabops-publish = "fabeval.publish:main"

[tool.setuptools.packages.find]
where = ["src"]

# Two packages ship data rather than only code, deliberately: the semantic
# layer's views are reviewable SQL (ADR-002) and the recommendation table is a
# data file so that a FabKG-supplied replacement is a file swap and not a
# release (FABOPS_VS_FABKG_BOUNDARY.md §3-4). Both must survive installation —
# an editable install would hide their absence from a wheel.
[tool.setuptools.package-data]
"fabops.semantic" = ["*.sql"]
"fabops.actions" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The diagnosis fixtures build their fault-free population in a process pool,
# and a worker can only unpickle the builder if the `tests` package is
# importable by name. This also makes `from tests.fabops...` work in-process.
pythonpath = ["."]
