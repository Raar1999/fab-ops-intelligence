# CI mirrors exactly the locally verified Phase 0 acceptance sequence:
# clean environment -> editable install -> tests -> full DB regeneration -> tests.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (editable, test extra)
        run: pip install -e ".[dev]"
      - name: Test against the committed database
        run: pytest -q
      - name: Regenerate the database from scratch and re-test
        run: |
          rm -f data/fab.db data/fab_database.sql
          python -m fabops.build_db
          pytest -q
